name: Firefox AMO release

on:
  workflow_dispatch:
    inputs:
      submit_to_amo:
        description: I tested this version locally and approve submission to Mozilla Add-ons
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:firefox-store
      - uses: actions/upload-artifact@v4
        with:
          name: clusterfudge-firefox-unsigned
          path: web-ext-artifacts/mozilla-store/*.zip
          if-no-files-found: error

  submit:
    if: ${{ inputs.submit_to_amo }}
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check AMO credentials
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if [ -z "$AMO_API_KEY" ] || [ -z "$AMO_API_SECRET" ]; then
            echo "Add AMO_API_KEY and AMO_API_SECRET as repository secrets before submitting."
            exit 1
          fi
      - name: Submit for AMO listed signing
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: >-
          npx web-ext sign
          --source-dir extension
          --artifacts-dir web-ext-artifacts/amo-signed
          --api-key "$AMO_API_KEY"
          --api-secret "$AMO_API_SECRET"
          --channel listed
          --amo-metadata .github/amo-metadata.json
          --approval-timeout 0
